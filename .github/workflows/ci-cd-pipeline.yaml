name: Snake Pipeline API Release

on:
  push:
    tags:
      - "v*.*.*"

# OIDC avoids storing a long-lived Azure client secret in GitHub.
permissions:
  contents: read
  id-token: write

# The registry cache uses one shared ACR tag. Serialize release builds so two
# workflow runs cannot overwrite that cache manifest at the same time.
concurrency:
  group: snake-pipeline-api-acr-cache
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 90
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_NAME: snake-pipeline-api
      AZURE_CORE_OUTPUT: none

    steps:
      # Copy files from the repository to the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release configuration
        shell: bash
        run: |
          test -n "$ACR_NAME" || { echo "GitHub variable ACR_NAME is required"; exit 1; }

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image with ACR layer cache
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max,compression=zstd
          provenance: mode=max

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    environment: release
    needs: build-push
    timeout-minutes: 30
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_NAME: snake-pipeline-api
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Validate release configuration
        shell: bash
        run: |
          test -n "$ACR_NAME" || { echo "GitHub variable ACR_NAME is required"; exit 1; }
          test -n "$CONTAINER_APP_NAME" || { echo "GitHub variable CONTAINER_APP_NAME is required"; exit 1; }
          test -n "$RESOURCE_GROUP" || { echo "GitHub variable AZURE_RESOURCE_GROUP is required"; exit 1; }

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ env.ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
