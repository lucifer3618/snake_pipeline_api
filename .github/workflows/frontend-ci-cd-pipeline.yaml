name: Snake Pipeline Frontend Release

on:
  push:
    tags:
      - "frontend/v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: snake-pipeline-frontend-acr-cache
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_NAME: snake-pipeline-demo-frontend
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release configuration
        shell: bash
        run: |
          test -n "$ACR_NAME" || { echo "GitHub variable ACR_NAME is required"; exit 1; }

      - name: Resolve image tag
        id: release
        shell: bash
        run: |
          image_tag="${GITHUB_REF_NAME#frontend/}"
          [[ "$image_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must match frontend/v<major>.<minor>.<patch>"
            exit 1
          }
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./demo/frontend
          file: ./demo/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max,compression=zstd
          provenance: mode=max
